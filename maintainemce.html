<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>অ্যাপ কাজ চলমান</title>
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(ellipse at 50% 0%, #0b1120 0%, #030712 100%);
            padding: 1.5rem;
        }

        .card {
            max-width: 640px;
            width: 100%;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            padding: 3rem 2.5rem;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.005);
        }

        /* ── logo / icon ring ── */
        .logo-ring {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
        }

        .logo-ring svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .logo-ring .spin-ring {
            transform-origin: center;
            animation: spin 2.8s linear infinite;
        }

        .logo-ring .spin-ring-reverse {
            transform-origin: center;
            animation: spin-reverse 3.6s linear infinite;
        }

        .logo-ring .pulse-dot {
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        .logo-ring .gear-icon {
            animation: pulse-gear 3s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes spin-reverse {
            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.85);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        @keyframes pulse-gear {
            0%,
            100% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(1.08) rotate(12deg);
            }
        }

        /* ── typography ── */
        .title-bn {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
            line-height: 1.3;
            margin-bottom: 0.4rem;
        }

        .title-bn span {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle-en {
            font-size: 1.1rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.04em;
            margin-bottom: 0.75rem;
            font-style: italic;
        }

        .divider {
            width: 60px;
            height: 2px;
            margin: 1.2rem auto;
            background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.6), transparent);
            border-radius: 4px;
        }

        .status-text {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.7;
            margin-bottom: 0.5rem;
        }

        .status-text .highlight {
            color: #93bbfc;
            font-weight: 500;
        }

        .status-en {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.02em;
            margin-bottom: 2rem;
        }

        /* ── progress bar ── */
        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            overflow: hidden;
            margin: 1.5rem 0 2rem;
            position: relative;
        }

        .progress-track .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
            background-size: 200% 100%;
            border-radius: 8px;
            animation: progress-load 3.2s ease-in-out infinite;
        }

        @keyframes progress-load {
            0% {
                width: 0%;
                background-position: 0% 0%;
            }
            50% {
                width: 72%;
                background-position: 100% 0%;
            }
            100% {
                width: 100%;
                background-position: 0% 0%;
            }
        }

        /* ── contact ── */
        .contact {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            padding: 0.7rem 1.6rem 0.7rem 1.4rem;
            margin-top: 0.5rem;
            transition: background 0.3s ease, border-color 0.3s ease;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 450;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
        }

        .contact:hover {
            background: rgba(96, 165, 250, 0.08);
            border-color: rgba(96, 165, 250, 0.2);
            color: #ffffff;
        }

        .contact .telegram-icon {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
        }

        .contact .handle {
            color: #93bbfc;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .contact-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 1.2rem;
            letter-spacing: 0.03em;
        }

        /* ── responsive ── */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }

            .logo-ring {
                width: 90px;
                height: 90px;
            }

            .title-bn {
                font-size: 1.6rem;
            }

            .subtitle-en {
                font-size: 0.95rem;
            }

            .status-text {
                font-size: 1rem;
            }

            .contact {
                font-size: 0.85rem;
                padding: 0.6rem 1.2rem 0.6rem 1rem;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 1.5rem 1rem;
            }

            .title-bn {
                font-size: 1.3rem;
            }

            .logo-ring {
                width: 72px;
                height: 72px;
            }
        }
    </style>
</head>
<body>

    <div class="card" role="main" aria-label="অ্যাপ কাজ চলমান">

        <!-- ─── Logo / Icon ─── -->
        <div class="logo-ring" aria-hidden="true">
            <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- outer ring (spin) -->
                <circle class="spin-ring" cx="60" cy="60" r="52"
                stroke="url(#ringGrad)" stroke-width="2.5"
                stroke-linecap="round"
                stroke-dasharray="140 100"
                stroke-dashoffset="20"
                />
                <!-- inner ring (reverse spin) -->
                <circle class="spin-ring-reverse" cx="60" cy="60" r="40"
                stroke="url(#ringGrad2)" stroke-width="1.5"
                stroke-linecap="round"
                stroke-dasharray="90 80"
                stroke-dashoffset="10"
                />
                <!-- center pulse dot -->
                <circle class="pulse-dot" cx="60" cy="60" r="10"
                fill="url(#dotGrad)"
                />
                <!-- small gear / cog ornament -->
                <g class="gear-icon" transform="translate(60,60)">
                    <circle cx="0" cy="0" r="18" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
                    <circle cx="0" cy="0" r="12" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
                    <circle cx="0" cy="0" r="4" fill="rgba(255,255,255,0.12)" />
                    <line x1="-14" y1="0" x2="-6" y2="0" stroke="rgba(255,255,255,0.10)" stroke-width="1.8" stroke-linecap="round" />
                    <line x1="6" y1="0" x2="14" y2="0" stroke="rgba(255,255,255,0.10)" stroke-width="1.8" stroke-linecap="round" />
                    <line x1="0" y1="-14" x2="0" y2="-6" stroke="rgba(255,255,255,0.10)" stroke-width="1.8" stroke-linecap="round" />
                    <line x1="0" y1="6" x2="0" y2="14" stroke="rgba(255,255,255,0.10)" stroke-width="1.8" stroke-linecap="round" />
                </g>

                <defs>
                    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
                        <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
                    </linearGradient>
                    <linearGradient id="ringGrad2" x1="1" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4" />
                        <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.15" />
                    </linearGradient>
                    <radialGradient id="dotGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#93bbfc" />
                        <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
                    </radialGradient>
                </defs>
            </svg>
        </div>

        <!-- ─── Heading (Bangla) ─── -->
        <h1 class="title-bn">
            অ্যাপটির <span>কাজ চলমান</span>
        </h1>

        <!-- ─── Sub (English) ─── -->
        <p class="subtitle-en">● &nbsp; App is under active development &nbsp; ●</p>

        <div class="divider"></div>

        <!-- ─── Status message (Bangla) ─── -->
        <p class="status-text">
            অনুগ্রহ করে <span class="highlight">অপেক্ষা করুন</span>
        </p>

        <!-- ─── Status message (English) ─── -->
        <p class="status-en">
            Please wait while we prepare the experience
        </p>

        <!-- ─── Progress bar ─── -->
        <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
            <div class="bar"></div>
        </div>

        <!-- ─── Contact (Telegram) ─── -->
        <a href="https://t.me/annonymous707" target="_blank" rel="noopener noreferrer" class="contact">
            <!-- Telegram SVG icon -->
            <svg class="telegram-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.162 2.732L1.094 10.395c-0.916 0.366-0.91 1.174-0.168 1.479l5.463 1.732 2.252 6.838c0.233 0.708 0.487 0.876 0.967 0.613l4.665-2.982 5.209 3.874c0.577 0.355 1.011 0.176 1.165-0.546l3.543-17.345c0.202-0.972-0.392-1.417-1.162-1.152zM19.084 6.798l-10.66 8.558-0.648-1.968 8.798-5.722c0.373-0.243 0.702-0.119 0.427 0.138l-6.472 5.867 0.613 1.859-0.738 0.471-1.886-5.676 10.362-4.055c0.332-0.13 0.576 0.091 0.424 0.526z" fill="currentColor" />
            </svg>
            <span>যোগাযোগ করুন</span>
            <span class="handle">@annonymous707</span>
        </a>

        <p class="contact-label">
            বিস্তারিত জানতে Telegram এ মেসেজ দিন
        </p>

    </div>

</body>
                              </html>
